<div class="relative" x-data="{ notifOpen: false }" @click.away="notifOpen = false">
    <button @click="notifOpen = !notifOpen" 
            hx-get="{% url 'users_web:notifications_list' %}" 
            hx-target="#notification-list-container-{{ bell_id }}"
            hx-trigger="click once"
            class="relative p-2 rounded-xl text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <div id="notification-badge-{{ bell_id }}">
            {% if unread_notifications_count > 0 %}
                <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 border-2 border-white rounded-full"></span>
            {% endif %}
        </div>
    </button>

    <div x-show="notifOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         x-cloak
         class="absolute {{ dropdown_class|default:'right-0' }} mt-2 w-80 bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden z-50">
        <div class="px-4 py-3 bg-slate-50/80 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-sm font-bold text-slate-800">Notificações</h3>
        </div>
        <div id="notification-list-container-{{ bell_id }}" class="notification-list-container max-h-96 overflow-y-auto overscroll-contain">
            <div class="p-6 flex justify-center items-center">
                <svg class="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
        </div>
    </div>
</div>
