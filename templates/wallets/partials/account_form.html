<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    x-data="{ isCreditCard: {% if account and account.type == 'credit_card' %}true{% else %}false{% endif %} }" @keydown.escape.window="$el.remove()">
    <div
        class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-4 relative">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white">{% if account %}Editar Conta{% else %}Nova Conta{% endif %}</h3>
            <button @click="$el.closest('.fixed').remove()"
                class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <form method="POST" action="{% if account %}{% url 'wallets_web:edit' account.id %}{% else %}{% url 'wallets_web:create' %}{% endif %}">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label
                        class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Nome
                        da Conta</label>
                    <input type="text" name="name" required placeholder="Ex: Conta Corrente Itaú" value="{{ account.name|default:'' }}"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Tipo</label>
                        <select name="type" x-on:change="isCreditCard = ($el.value === 'credit_card')" required {% if account %}disabled{% endif %}
                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="checking" {% if account.type == 'checking' %}selected{% endif %}>Conta Corrente</option>
                            <option value="savings" {% if account.type == 'savings' %}selected{% endif %}>Poupança</option>
                            <option value="investment" {% if account.type == 'investment' %}selected{% endif %}>Investimento</option>
                            <option value="credit_card" {% if account.type == 'credit_card' %}selected{% endif %}>Cartão de Crédito</option>
                            <option value="other" {% if account.type == 'other' %}selected{% endif %}>Outro</option>
                        </select>
                        {% if account %}
                            <input type="hidden" name="type" value="{{ account.type }}">
                        {% endif %}
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Instituição</label>
                        <input type="text" name="institution" placeholder="Ex: Nubank" value="{{ account.institution|default:'' }}"
                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Saldo
                            Inicial (R$)</label>
                        <input type="number" step="0.01" name="balance" required value="{{ account.initial_balance|default:'0.00' }}" {% if account %}disabled{% endif %}
                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        {% if account %}
                            <input type="hidden" name="balance" value="{{ account.initial_balance }}">
                        {% endif %}
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Cor
                            de Identificação</label>
                        <input type="color" name="color" value="{{ account.color|default:'#6366f1' }}"
                            class="w-full h-10 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl p-1 cursor-pointer">
                    </div>
                </div>

                <!-- Credit Card Details (Conditional via Alpine) -->
                <div x-show="isCreditCard" x-cloak
                    class="space-y-4 pt-3 border-t border-slate-200 dark:border-slate-800">
                    <h4 class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">Detalhes
                        do Cartão de Crédito</h4>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Limite
                            Total (R$)</label>
                        <input type="number" step="0.01" name="limit" placeholder="5000.00" value="{{ account.credit_card_details.limit|default:'' }}"
                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Dia
                                Fechamento</label>
                            <input type="number" min="1" max="31" name="closing_day" value="{{ account.credit_card_details.closing_day|default:'1' }}"
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Dia
                                Vencimento</label>
                            <input type="number" min="1" max="31" name="due_day" value="{{ account.credit_card_details.due_day|default:'10' }}"
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="flex items-center justify-end space-x-3 mt-4 pt-4 border-t border-slate-200 dark:border-slate-800">
                <button type="button" @click="$el.closest('.fixed').remove()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">Cancelar</button>
                <button type="submit"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-md shadow-indigo-600/20">{% if account %}Atualizar Conta{% else %}Criar Conta{% endif %}</button>
            </div>
        </form>
    </div>
</div>
