<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overscroll-none" x-data="{ adjustmentType: 'transaction' }" role="dialog" aria-modal="true" aria-labelledby="adjustment-modal-title" @keydown.escape.window="$el.remove()">
    <div class="bg-white text-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-5 md:p-6 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto overscroll-contain" @click.stop>
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <h3 id="adjustment-modal-title" class="text-lg font-bold text-slate-900">Reajuste de Saldo</h3>
            <button @click="$el.closest('.fixed').remove()" aria-label="Fechar modal" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form hx-post="{% url 'wallets_web:balance_adjustment' account.id %}" hx-target="#modal-container">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Conta</label>
                    <p class="text-sm text-slate-900 font-bold">{{ account.name }}</p>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Saldo Atual</label>
                    <p class="text-sm font-bold {% if account.balance >= 0 %}text-emerald-600{% else %}text-rose-600{% endif %}">R$ {{ account.balance|floatformat:2 }}</p>
                </div>
                <div x-data="moneyInput('0.00', {% if account.type == 'credit_card' %}true{% else %}false{% endif %})">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Novo Saldo (R$)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required :value="displayValue" @input="onInput($event)" @focus="$event.target.select()"
                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 transition">
                    <input type="hidden" name="new_balance" :value="rawValue">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Forma de Reajuste</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="relative flex items-center justify-center p-3 cursor-pointer rounded-xl border border-slate-200 hover:bg-slate-50 transition"
                            :class="{ 'ring-2 ring-indigo-500 border-indigo-500 bg-indigo-50': adjustmentType === 'transaction' }">
                            <input type="radio" name="adjustment_type" value="transaction" x-model="adjustmentType" aria-label="Criar Transação de Reajuste" class="sr-only">
                            <span class="text-xs font-bold text-center text-slate-700">Criar Transação<br/><span class="text-[10px] font-normal text-slate-500 block mt-1">(Recomendado)</span></span>
                        </label>
                        <label class="relative flex items-center justify-center p-3 cursor-pointer rounded-xl border border-slate-200 hover:bg-slate-50 transition"
                            :class="{ 'ring-2 ring-indigo-500 border-indigo-500 bg-indigo-50': adjustmentType === 'initial' }">
                            <input type="radio" name="adjustment_type" value="initial" x-model="adjustmentType" aria-label="Alterar Saldo Inicial" class="sr-only">
                            <span class="text-xs font-bold text-center text-slate-700">Alterar Saldo Inicial<br/><span class="text-[10px] font-normal text-slate-500 block mt-1">(Muda o histórico)</span></span>
                        </label>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-slate-200">
                    <button type="button" @click="$el.closest('.fixed').remove()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition border border-slate-200/80 shadow-sm">Cancelar</button>
                    <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 transition">Confirmar Reajuste</button>
                </div>
            </div>
        </form>
    </div>
</div>
