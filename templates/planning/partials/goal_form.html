<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title" @keydown.escape.window="$el.remove()">
    <div class="bg-white text-slate-900 w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 p-5 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto" @click.stop>
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <h3 id="goal-modal-title" class="text-lg font-bold text-slate-900">Novo Objetivo</h3>
            <button @click="$el.closest('.fixed').remove()" aria-label="Fechar modal" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form hx-post="{% url 'planning_web:goal_create' %}" hx-target="#modal-container">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nome do Objetivo</label>
                    <input type="text" name="name" required placeholder="Ex: Reserva de Emergência, Carro Novo..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Vincular à Conta Principal</label>
                    <select name="account" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 transition">
                        <option value="" disabled selected>Escolha uma conta para separar o saldo...</option>
                        {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.name }} (Saldo Livre: R$ {{ acc.free_balance|floatformat:2 }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div x-data="moneyInput('0.00')">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Valor Meta (R$)</label>
                        <input type="text" inputmode="decimal" autocomplete="off" placeholder="5.000,00" required :value="displayValue" @input="onInput($event)" @focus="$event.target.select()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                        <input type="hidden" name="target_amount" :value="rawValue">
                    </div>
                    <div x-data="moneyInput('0.00')">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Valor Inicial (R$)</label>
                        <input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" :value="displayValue" @input="onInput($event)" @focus="$event.target.select()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                        <input type="hidden" name="current_amount" :value="rawValue">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Início</label>
                        <input type="date" name="start_date" required value="{% now 'Y-m-d' %}" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Término Esperado</label>
                        <input type="date" name="end_date" required value="{% now 'Y-12-31' %}" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8 pt-5 border-t border-slate-200">
                <button type="button" @click="$el.closest('.fixed').remove()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition">Cancelar</button>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition">Criar Objetivo</button>
            </div>
        </form>
    </div>
</div>
