<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overscroll-none" role="dialog" aria-modal="true" aria-labelledby="budget-modal-title" @click.self="$el.remove()" @keydown.escape.window="$el.remove()">
    <div class="bg-white text-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-5 md:p-6 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto overscroll-contain" @click.stop>
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <h3 id="budget-modal-title" class="text-lg font-bold text-slate-900">Novo Orçamento</h3>
            <button @click="$el.closest('.fixed').remove()" aria-label="Fechar modal" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form hx-post="{% url 'planning_web:budget_create' %}" hx-target="#modal-container" x-data="{ isRecurring: true }">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Categoria</label>
                    <select name="category" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% empty %}
                            <option value="" disabled selected>Nenhuma categoria cadastrada</option>
                        {% endfor %}
                    </select>
                    {% if not categories %}
                        <p class="text-[11px] text-amber-600 mt-1">Nenhuma categoria. <a href="{% url 'transactions_web:category_list' %}" class="underline font-semibold">Cadastrar categoria</a></p>
                    {% endif %}
                </div>
                <div x-data="moneyInput('0.00')">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" x-text="isRecurring ? 'Teto Mensal (R$)' : 'Teto Máximo (R$)'">Teto Mensal (R$)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required :value="displayValue" @input="onInput($event)" @focus="$event.target.select()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                    <input type="hidden" name="amount" :value="rawValue">
                </div>

                <div>
                    <label class="flex items-center justify-between cursor-pointer p-3.5 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100/80 transition">
                        <div class="space-y-0.5">
                            <span class="text-xs font-bold text-slate-800 block">Renovar todo mês automaticamente</span>
                            <span class="text-[11px] text-slate-500 block">Reseta o consumo no dia 1º e mantém o histórico</span>
                        </div>
                        <input type="checkbox" name="is_recurring" x-model="isRecurring" value="true" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 relative shrink-0 ml-3"></div>
                    </label>

                    <div x-show="!isRecurring" x-cloak class="grid grid-cols-2 gap-4 mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-xl animate-in fade-in duration-150">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Início</label>
                            <input type="date" name="start_date" :required="!isRecurring" value="{% now 'Y-m-01' %}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Término</label>
                            <input type="date" name="end_date" :required="!isRecurring" value="{% now 'Y-m-t' %}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-slate-200">
                <button type="button" @click="$el.closest('.fixed').remove()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition border border-slate-200/80 shadow-sm">Cancelar</button>
                <button type="submit" {% if not categories %}disabled{% endif %} class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white shadow-lg shadow-indigo-600/25 transition">Criar Orçamento</button>
            </div>
        </form>
    </div>
</div>
