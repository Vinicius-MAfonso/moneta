<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4" x-data="{ open: true, deleteAction: 'move' }" x-show="open" x-transition>
    <div class="glass-panel max-w-md w-full p-6 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 space-y-5 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
        
        <div class="flex items-start space-x-4">
            <div class="w-11 h-11 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <div class="space-y-1">
                <h3 class="text-lg font-extrabold text-slate-900 dark:text-white tracking-tight">Excluir Categoria</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                    A categoria <strong>{{ category.name }}</strong> possui <strong>{{ transactions_count }}</strong> transações atreladas a ela. O que você deseja fazer com essas transações?
                </p>
            </div>
        </div>

        <form method="POST" action="{% url 'transactions_web:category_delete' category.id %}" class="space-y-4">
            {% csrf_token %}

            <div class="space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Opções de exclusão:</label>
                
                <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition">
                    <input type="radio" name="delete_action" value="move" x-model="deleteAction" class="text-rose-600 focus:ring-rose-500">
                    <span>Mover transações para outra categoria</span>
                </label>

                <div x-show="deleteAction === 'move'" x-collapse class="pl-2 pt-1 pb-2">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase">Categoria de Destino:</label>
                    <select name="fallback_category_id" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-slate-100 focus:outline-none focus:border-rose-500">
                        {% for cat in fallback_categories %}
                            <option value="{{ cat.id }}">{% if cat.icon %}{{ cat.icon }} {% endif %}{{ cat.name }}</option>
                        {% empty %}
                            <option value="" disabled>Nenhuma outra categoria encontrada</option>
                        {% endfor %}
                    </select>
                </div>

                <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-rose-50 dark:hover:bg-rose-900/20 cursor-pointer transition">
                    <input type="radio" name="delete_action" value="delete_all" x-model="deleteAction" class="text-rose-600 focus:ring-rose-500">
                    <span class="text-rose-600 dark:text-rose-400">Excluir categoria E todas as transações</span>
                </label>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold text-xs transition">
                    Cancelar
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs transition shadow-lg shadow-rose-600/25">
                    Confirmar Exclusão
                </button>
            </div>
        </form>
    </div>
</div>
