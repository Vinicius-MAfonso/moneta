<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overscroll-none" role="dialog" aria-modal="true" aria-labelledby="cat-delete-title" x-data="{ open: true, deleteAction: 'move' }" x-show="open" x-transition @keydown.escape.window="$el.remove()">
    <div class="bg-white text-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-5 md:p-6 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto overscroll-contain" @click.stop>
        
        <div class="flex items-start space-x-4">
            <div class="w-11 h-11 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-600 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <div class="space-y-1">
                <h3 id="cat-delete-title" class="text-lg font-bold text-slate-900 tracking-tight">Excluir Categoria</h3>
                <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                    A categoria <strong>{{ category.name }}</strong> possui <strong>{{ transactions_count }}</strong> transações atreladas a ela. O que você deseja fazer com essas transações?
                </p>
            </div>
        </div>

        <form hx-post="{% url 'transactions_web:category_delete' category.id %}" hx-target="#modal-container" class="space-y-4">
            {% csrf_token %}

            <div class="space-y-2 pt-2 border-t border-slate-200">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Opções de exclusão:</label>
                
                <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                    <input type="radio" name="delete_action" value="move" x-model="deleteAction" class="text-rose-600 focus:ring-rose-500">
                    <span>Mover transações para outra categoria</span>
                </label>

                <div x-show="deleteAction === 'move'" x-collapse class="pl-2 pt-1 pb-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">Categoria de Destino:</label>
                    <select name="fallback_category_id" :disabled="deleteAction !== 'move'" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-rose-500">
                        {% for cat in fallback_categories %}
                            <option value="{{ cat.id }}">{% if cat.icon %}{{ cat.icon }} {% endif %}{{ cat.name }}</option>
                        {% empty %}
                            <option value="" disabled>Nenhuma outra categoria encontrada</option>
                        {% endfor %}
                    </select>
                </div>

                <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700 p-2.5 rounded-xl border border-slate-200 hover:bg-rose-50 cursor-pointer transition">
                    <input type="radio" name="delete_action" value="delete_all" x-model="deleteAction" class="text-rose-600 focus:ring-rose-500">
                    <span class="text-rose-600">Excluir categoria E todas as transações</span>
                </label>
            </div>

            <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-slate-200">
                <button type="button" @click="$el.closest('.fixed').remove()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition border border-slate-200/80 shadow-sm">
                    Cancelar
                </button>
                <button type="submit" {% if not fallback_categories %}x-bind:disabled="deleteAction === 'move'"{% endif %} class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-rose-600 hover:bg-rose-500 disabled:opacity-50 disabled:cursor-not-allowed text-white transition shadow-lg shadow-rose-600/25">
                    Confirmar Exclusão
                </button>
            </div>
        </form>
    </div>
</div>
