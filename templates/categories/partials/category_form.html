<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    @keydown.escape.window="$el.remove()">
    <div
        class="bg-white  text-slate-900  w-full max-w-md rounded-2xl shadow-2xl border border-slate-200  p-5 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-200  pb-3">
            <h3 class="text-lg font-bold text-slate-900 ">Nova Categoria</h3>
            <button @click="$el.closest('.fixed').remove()"
                class="text-slate-400 hover:text-slate-700  p-1 rounded-lg hover:bg-slate-100 ">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <form method="POST" action="{% url 'transactions_web:category_create' %}">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label
                        class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Nome
                        da Categoria</label>
                    <input type="text" name="name" required placeholder="Ex: Moradia, Alimentação..."
                        class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Tipo</label>
                        <select name="type" required
                            class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                            <option value="despesa">Despesa</option>
                            <option value="receita">Receita</option>
                            <option value="transferência">Transferência</option>
                        </select>
                    </div>
                    <div x-data="categoryFormFactory()" class="relative">
                        <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">
                            Ícone
                        </label>
                        <div class="relative">
                            <input type="text" name="icon" x-model="selected" readonly @click="open = !open"
                                placeholder="Ex: 🍔"
                                class="cursor-pointer w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2 text-sm text-slate-900  focus:outline-none focus:border-indigo-500 pr-10">
                            <button type="button" @click="open = !open"
                                class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 ">
                            </button>
                        </div>
                        <div x-show="open" @click.away="open = false" x-cloak
                            class="absolute top-full right-0 mt-1 w-max bg-white  border border-slate-200  rounded-xl shadow-xl p-2 z-50">
                            <div class="grid grid-cols-5 gap-1">
                                <template x-for="emoji in emojis">
                                    <button type="button" @click="selected = emoji; open = false"
                                        class="w-8 h-8 flex items-center justify-center text-lg hover:bg-slate-100  rounded-lg transition"
                                        x-text="emoji"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Cor</label>
                        <input type="color" name="color" value="#6366f1"
                            class="w-full h-10 bg-slate-50  border border-slate-300  rounded-xl p-1 cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-8 pt-5 border-t border-slate-200 ">
                <button type="button" @click="$el.closest('.fixed').remove()"
                    class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600  hover:text-slate-900  bg-slate-100  hover:bg-slate-200  transition">Cancelar</button>
                <button type="submit"
                    class="px-6 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white shadow-lg shadow-indigo-600/30 transition">Criar Categoria</button>
            </div>
        </form>
    </div>
</div>

<script>
    function categoryFormFactory() {
        return {
            open: false,
            selected: '',
            emojis: ['🍔', '🏠', '🚌', '🎉', '🏥', '📚', '👕', '📱', '🐾', '✈️', '💰', '⚖️', '🏷️', '💡', '🏷️']
        };
    }
</script>
