<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overscroll-none" x-data="payModal('{{ transaction.date|date:"Y-m-d" }}')" x-show="open" role="dialog" aria-modal="true" aria-labelledby="pay-modal-title" x-transition @click.self="close()" @keydown.escape.window="close()">
    <div class="bg-white text-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-5 md:p-6 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto overscroll-contain" @click.stop>
        
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <h3 id="pay-modal-title" class="text-lg font-bold text-slate-900">Efetivar {% if transaction.category.type == 'despesa' %}Despesa{% elif transaction.category.type == 'receita' %}Receita{% else %}Transferência{% endif %}</h3>
            <button @click="close()" aria-label="Fechar modal" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form hx-post="{% url 'transactions_web:pay' transaction.id %}" hx-target="#modal-container" hx-on::after-request="if(event.detail.successful) { document.getElementById('filter-form') ? document.getElementById('filter-form').dispatchEvent(new Event('submit')) : window.location.reload(); this.closest('.fixed').remove(); }">
            {% csrf_token %}
            <input type="hidden" name="date" :value="dateValue">

            <div class="mb-4">
                <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                    Ao efetivar, o valor abaixo será contabilizado na sua conta e o status mudará para concluído.
                </p>
            </div>

            <div class="flex flex-col gap-5">
                <div x-data="moneyInput('{{ transaction.amount|stringformat:'.2f'|default:'0.00' }}')">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Valor (R$)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" required :value="displayValue" @input="onInput($event)" @focus="$event.target.select()"
                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold focus:outline-none focus:border-indigo-500 transition-colors
                        {% if transaction.category.type == 'despesa' %}text-rose-600{% elif transaction.category.type == 'receita' %}text-emerald-600{% else %}text-slate-900{% endif %}">
                    <input type="hidden" name="amount" :value="rawValue">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data</label>
                    <div class="flex items-center gap-2 mb-2">
                        <button type="button" @click="setDate('today')" :class="dateMode === 'today' ? 'bg-indigo-500/20 text-indigo-600 font-bold border border-indigo-500/40 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-100'" class="px-3 py-1.5 rounded-lg text-[11px] font-semibold transition-all border">Hoje</button>
                        <button type="button" @click="setDate('yesterday')" :class="dateMode === 'yesterday' ? 'bg-indigo-500/20 text-indigo-600 font-bold border border-indigo-500/40 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-100'" class="px-3 py-1.5 rounded-lg text-[11px] font-semibold transition-all border">Ontem</button>
                        <button type="button" @click="setDate('other')" :class="dateMode === 'other' ? 'bg-indigo-500/20 text-indigo-600 font-bold border border-indigo-500/40 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-100'" class="px-3 py-1.5 rounded-lg text-[11px] font-semibold transition-all border">Outra...</button>
                    </div>
                    <div x-show="dateMode === 'other'" x-transition class="mt-2">
                        <input type="date" required x-model="dateValue" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Conta</label>
                    <select name="account" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 pr-10 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                        {% for acc in accounts %}
                            <option value="{{ acc.id }}" {% if acc.id == transaction.account.id %}selected{% endif %}>{{ acc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-slate-200">
                <button type="button" @click="close()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition border border-slate-200/80 shadow-sm">Cancelar</button>
                <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition shadow-lg flex items-center justify-center gap-2
                    {% if transaction.category.type == 'despesa' %}bg-rose-600 hover:bg-rose-500 text-white shadow-rose-600/30
                    {% elif transaction.category.type == 'receita' %}bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30
                    {% else %}bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-600/30{% endif %}">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>{% if transaction.category.type == 'despesa' %}Pagar{% elif transaction.category.type == 'receita' %}Receber{% else %}Efetivar{% endif %}</span>
                </button>
            </div>
        </form>
    </div>
</div>
