<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-data="{ txType: 'despesa', isRecurring: false }" @keydown.escape.window="$el.remove()">
    <div class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white" x-text="txType === 'transferencia' ? 'Nova Transferência' : 'Nova Transação'">Nova Transação</h3>
            <button @click="$el.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form hx-post="{% url 'transactions_web:create' %}" hx-target="#modal-container" hx-on::after-request="if(event.detail.successful) { document.getElementById('filter-form') ? document.getElementById('filter-form').dispatchEvent(new Event('submit')) : window.location.reload(); this.closest('.fixed').remove(); }">
            {% csrf_token %}
            <input type="hidden" name="tx_type" :value="txType">

            <div class="space-y-4">
                
                <!-- Type Selection (Despesa / Receita / Transferência) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Tipo de Movimentação</label>
                    <div class="grid grid-cols-3 gap-2 p-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">
                        <button type="button" @click="txType = 'despesa'" :class="txType === 'despesa' ? 'bg-rose-500/20 text-rose-600 dark:text-rose-400 font-bold border border-rose-500/40 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'" class="py-2 rounded-lg text-xs font-semibold transition-all">
                            Despesa
                        </button>
                        <button type="button" @click="txType = 'receita'" :class="txType === 'receita' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold border border-emerald-500/40 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'" class="py-2 rounded-lg text-xs font-semibold transition-all">
                            Receita
                        </button>
                        <button type="button" @click="txType = 'transferencia'" :class="txType === 'transferencia' ? 'bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 font-bold border border-indigo-500/40 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'" class="py-2 rounded-lg text-xs font-semibold transition-all">
                            Transferência
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Descrição</label>
                    <input type="text" name="description" required :placeholder="txType === 'transferencia' ? 'Ex: Reserva de Emergência, Transferência Nubank...' : 'Ex: Supermercado, Salário...'" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" min="0.01" name="amount" required placeholder="0.00" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Data</label>
                        <input type="date" name="date" required value="{% now 'Y-m-d' %}" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Account / Category for Despesa & Receita -->
                <div x-show="txType !== 'transferencia'" class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Conta</label>
                        <select name="account" :required="txType !== 'transferencia'" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                            {% for account in accounts %}
                                <option value="{{ account.id }}">{{ account.name }}</option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma conta cadastrada</option>
                            {% endfor %}
                        </select>
                        {% if not accounts %}
                            <p class="text-[11px] text-amber-600 dark:text-amber-400 mt-1">Nenhuma conta. <a href="{% url 'wallets_web:list' %}" class="underline font-semibold">Cadastrar conta</a></p>
                        {% endif %}
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Categoria</label>
                        <select name="category" :required="txType !== 'transferencia'" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" x-show="txType === '{{ cat.type }}'" :disabled="txType !== '{{ cat.type }}'">
                                    {{ cat.name }}
                                </option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma categoria cadastrada</option>
                            {% endfor %}
                        </select>
                        {% if not categories %}
                            <p class="text-[11px] text-amber-600 dark:text-amber-400 mt-1">Nenhuma categoria. <a href="{% url 'transactions_web:category_list' %}" class="underline font-semibold">Cadastrar categoria</a></p>
                        {% endif %}
                    </div>
                </div>

                <!-- Out Account / In Account for Transferência -->
                <div x-show="txType === 'transferencia'" class="grid grid-cols-2 gap-4" x-cloak>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Conta Origem (Saída)</label>
                        <select name="out_account" :required="txType === 'transferencia'" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                            {% for account in accounts %}
                                <option value="{{ account.id }}">{{ account.name }}</option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma conta cadastrada</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Conta Destino (Entrada)</label>
                        <select name="in_account" :required="txType === 'transferencia'" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                            {% for account in accounts %}
                                <option value="{{ account.id }}" {% if forloop.counter == 2 %}selected{% endif %}>{{ account.name }}</option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma conta cadastrada</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div x-show="txType !== 'transferencia'">
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Status</label>
                    <select name="status" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="concluída" selected>Concluída / Pago</option>
                        <option value="pendente">Pendente / A Vencer</option>
                    </select>
                </div>

                <!-- Tags Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Tags (Opcional)</label>
                    <div class="flex flex-wrap gap-2 p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl min-h-[42px] items-center">
                        {% for tag in tags %}
                            <label class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer border transition-all hover:scale-105" style="background-color: {{ tag.color }}15; border-color: {{ tag.color }}40; color: {{ tag.color }};">
                                <input type="checkbox" name="tags" value="{{ tag.id }}" class="rounded text-indigo-600 focus:ring-0">
                                <span>{{ tag.name }}</span>
                            </label>
                        {% empty %}
                            <span class="text-xs text-slate-400 italic">Nenhuma tag cadastrada. <a href="{% url 'transactions_web:category_list' %}" class="underline">Criar tag</a></span>
                        {% endfor %}
                    </div>
                </div>

                <!-- Recurring Transaction Toggle -->
                <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-3">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300" x-text="txType === 'transferencia' ? 'Repetir esta transferência (Recorrente)' : 'Repetir esta transação (Recorrente)'">Repetir esta transação (Recorrente)</span>
                        <input type="checkbox" name="is_recurring" x-model="isRecurring" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:peer-focus:ring-indigo-800 peer-checked:bg-indigo-600 relative"></div>
                    </label>

                    <div x-show="isRecurring" x-cloak class="grid grid-cols-2 gap-3 p-3.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Frequência</label>
                            <select name="frequency" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-100">
                                <option value="monthly" selected>Mensalmente</option>
                                <option value="weekly">Semanalmente</option>
                                <option value="daily">Diariamente</option>
                                <option value="yearly">Anualmente</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Término (Opcional)</label>
                            <input type="date" name="recurring_end_date" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-100">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 mt-6 pt-4 border-t border-slate-200 dark:border-slate-800">
                <button type="button" @click="$el.closest('.fixed').remove()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">Cancelar</button>
                <button type="submit" {% if not accounts %}disabled{% endif %} class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white shadow-lg shadow-indigo-600/30 font-bold" x-text="txType === 'transferencia' ? 'Salvar Transferência' : 'Salvar Transação'">Salvar Transação</button>
            </div>
        </form>
    </div>
</div>
