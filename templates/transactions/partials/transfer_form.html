<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" @keydown.escape.window="$el.remove()">
    <div class="bg-white  text-slate-900  w-full max-w-md rounded-2xl shadow-2xl border border-slate-200  p-5 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-200  pb-3">
            <h3 class="text-lg font-bold text-slate-900 ">Nova Transferência entre Contas</h3>
            <button @click="$el.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700  p-1 rounded-lg hover:bg-slate-100 ">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form method="POST" action="{% url 'transactions_web:transfer_create' %}">
            {% csrf_token %}
            <div class="space-y-4" x-data="{ outAccount: '{{ accounts.0.id|default:'' }}' }">
                <div>
                    <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Descrição</label>
                    <input type="text" name="description" required placeholder="Ex: Transferência para Poupança" class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Conta Origem (Saída)</label>
                        <select name="out_account" x-model="outAccount" required class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                            {% for account in accounts %}
                                <option value="{{ account.id }}">{{ account.name }}</option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma conta</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Conta Destino (Entrada)</label>
                        <select name="in_account" required class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                            {% for account in accounts %}
                                <option value="{{ account.id }}" {% if forloop.counter == 2 %}selected{% endif %} :disabled="outAccount === '{{ account.id }}'" :class="outAccount === '{{ account.id }}' ? 'hidden' : ''">{{ account.name }}</option>
                            {% empty %}
                                <option value="" disabled selected>Nenhuma conta</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                {% if not accounts %}
                    <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-600 ">
                        Você precisa ter pelo menos duas contas cadastradas para realizar transferências. <a href="{% url 'wallets_web:list' %}" class="underline font-bold">Cadastrar contas</a>
                    </div>
                {% endif %}

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Valor (R$)</label>
                        <input type="number" step="0.01" min="0.01" name="amount" required placeholder="500.00" class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-1.5">Data</label>
                        <input type="date" name="date" required value="{% now 'Y-m-d' %}" class="w-full bg-slate-50  border border-slate-300  rounded-xl px-3.5 py-2.5 text-sm text-slate-900  focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-8 pt-5 border-t border-slate-200 ">
                <button type="button" @click="$el.closest('.fixed').remove()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600  hover:text-slate-900  bg-slate-100  hover:bg-slate-200  transition">Cancelar</button>
                <button type="submit" {% if not accounts %}disabled{% endif %} class="px-6 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white shadow-lg shadow-indigo-600/30 transition">Executar Transferência</button>
            </div>
        </form>
    </div>
</div>
