{% extends "base.html" %}

{% block title %}Transações - Moneta{% endblock %}

{% block content %}
<div class="space-y-6">

    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Transações</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Gerencie e filtre suas receitas, despesas e transferências</p>
        </div>
        <div class="flex flex-wrap items-center gap-2.5">
            <!-- Month Navigation Selector -->
            <div class="inline-flex items-center space-x-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-3 py-1.5 shadow-sm text-sm font-bold text-slate-800 dark:text-slate-100">
                <a href="?month={{ month_info.prev_month }}" class="p-1 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <span class="px-2 min-w-[110px] text-center font-bold text-indigo-600 dark:text-indigo-400 capitalize text-xs md:text-sm">{{ month_info.month_label }}</span>
                <a href="?month={{ month_info.next_month }}" class="p-1 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>

            <button hx-get="{% url 'transactions_web:transfer_create' %}" hx-target="#modal-container" class="inline-flex items-center space-x-2 px-3.5 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-medium text-xs md:text-sm transition-all border border-slate-300 dark:border-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                <span>Transferir</span>
            </button>
            <button hx-get="{% url 'transactions_web:create' %}" hx-target="#modal-container" class="inline-flex items-center space-x-2 px-3.5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs md:text-sm transition-all shadow-lg shadow-indigo-600/25">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Nova Transação</span>
            </button>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="glass-panel p-4 rounded-2xl">
        <form id="filter-form" hx-get="{% url 'transactions_web:list' %}" hx-target="#transaction-table-wrapper" hx-trigger="submit, change from:select, keyup delay:300ms from:input[name='search']" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <input type="hidden" name="month" value="{{ month_info.current_month_str }}">
            
            <!-- Search Input -->
            <div>
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Buscar</label>
                <input type="text" name="search" placeholder="Descrição..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Type Filter (Receita / Despesa / Transferência) -->
            <div>
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Tipo</label>
                <select name="type" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Todos os Tipos</option>
                    <option value="despesa">Despesa</option>
                    <option value="receita">Receita</option>
                    <option value="transferência">Transferência</option>
                </select>
            </div>

            <!-- Account Filter -->
            <div>
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Conta</label>
                <select name="account_id" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Todas as Contas</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}">{{ account.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Category Filter -->
            <div>
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Categoria</label>
                <select name="category_id" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Todas as Categorias</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Status Filter -->
            <div>
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Status</label>
                <select name="status" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Todos</option>
                    <option value="concluída">Concluída</option>
                    <option value="pendente">Pendente</option>
                </select>
            </div>
        </form>
    </div>

    <!-- Table Container -->
    <div id="transaction-table-wrapper" class="glass-panel p-4 rounded-2xl">
        {% include "transactions/partials/transaction_list.html" %}
    </div>

</div>
{% endblock %}
