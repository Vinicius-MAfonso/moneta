{% extends "base.html" %}

{% block title %}Transações - Moneta{% endblock %}

{% block content %}
<div class="space-y-6">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Transações</h2>
            <p class="text-slate-500 text-sm mt-1">Gerencie e filtre suas receitas, despesas e transferências</p>
        </div>
        <div class="flex flex-wrap items-center gap-2.5">
            <div class="inline-flex items-center space-x-1 bg-white border border-slate-200 rounded-2xl px-3 py-1.5 shadow-sm text-sm font-bold text-slate-800">
                <a href="?{{ prev_month_url }}" aria-label="Mês anterior" class="p-1 text-slate-500 hover:text-indigo-600 transition">
                    <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <span class="px-2 min-w-[110px] text-center font-bold text-indigo-600 capitalize text-xs md:text-sm">{{ month_info.month_label }}</span>
                <a href="?{{ next_month_url }}" aria-label="Próximo mês" class="p-1 text-slate-500 hover:text-indigo-600 transition">
                    <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>

            <button hx-get="{% url 'transactions_web:create' %}" hx-target="#modal-container" class="inline-flex items-center space-x-2 px-3.5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs md:text-sm transition-all shadow-lg shadow-indigo-600/25">
                <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Nova Transação</span>
            </button>
        </div>
    </div>

    <div class="glass-panel p-4 rounded-2xl">
        <form id="filter-form" aria-label="Filtros de transações" hx-get="{% url 'transactions_web:list' %}" hx-target="#transaction-table-wrapper" hx-trigger="submit, change from:select, keyup delay:300ms from:input[name='search']" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <input type="hidden" name="month" value="{{ month_info.current_month_str }}">
            
            <div>
                <label class="block text-[10px] font-bold text-slate-600 uppercase tracking-wider mb-1">Buscar</label>
                <input type="text" name="search" value="{{ request.GET.search }}" placeholder="Descrição..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-600 uppercase tracking-wider mb-1">Tipo</label>
                <select name="type" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    <option value="">Todos os Tipos</option>
                    <option value="despesa" {% if request.GET.type == 'despesa' %}selected{% endif %}>Despesa</option>
                    <option value="receita" {% if request.GET.type == 'receita' %}selected{% endif %}>Receita</option>
                    <option value="transferência" {% if request.GET.type == 'transferência' %}selected{% endif %}>Transferência</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-600 uppercase tracking-wider mb-1">Conta</label>
                <select name="account_id" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    <option value="">Todas as Contas</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}" {% if request.GET.account_id == account.id|stringformat:"s" %}selected{% endif %}>{{ account.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-600 uppercase tracking-wider mb-1">Categoria</label>
                <select name="category_id" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    <option value="">Todas as Categorias</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}" {% if request.GET.category_id == category.id|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-600 uppercase tracking-wider mb-1">Status</label>
                <select name="status" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    <option value="">Todos</option>
                    <option value="concluída" {% if request.GET.status == 'concluída' %}selected{% endif %}>Concluída</option>
                    <option value="pendente" {% if request.GET.status == 'pendente' %}selected{% endif %}>Pendente</option>
                </select>
            </div>
        </form>
    </div>

    <div id="transaction-table-wrapper" class="glass-panel p-4 rounded-2xl">
        {% include "transactions/partials/transaction_list.html" %}
    </div>

</div>
{% endblock %}
