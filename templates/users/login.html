{% extends "users/auth_base.html" %}
{% block title %}Entrar - Moneta{% endblock %}
{% block subtitle %}Acesse sua conta para gerenciar suas finanças{% endblock %}
{% block content %}
<div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-2xl space-y-6">
    <form x-data="{ loading: false }" @submit="loading = true" method="POST" action="{% url 'users_web:login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Usuário</label>
            <input type="text" name="username" required autofocus placeholder="Seu nome de usuário" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Senha</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <button type="submit" :disabled="loading" :class="{'opacity-75 cursor-not-allowed': loading}" class="w-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
            <svg x-show="loading" style="display: none;" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-show="!loading">Entrar</span>
            <span x-show="loading" style="display: none;">Entrando...</span>
        </button>
        <div class="text-center mt-4">
            <a href="{% url 'users_web:password_reset' %}" class="text-xs text-indigo-600 hover:underline">
                Esqueceu sua senha?
            </a>
        </div>
    </form>
    <div class="pt-4 border-t border-slate-200 text-center text-xs text-slate-500">
        <span>Ainda não tem uma conta?</span>
        <a href="{% url 'users_web:register' %}" class="text-indigo-600 hover:underline font-semibold ml-1">Criar conta grátis</a>
    </div>
</div>
{% endblock %}
