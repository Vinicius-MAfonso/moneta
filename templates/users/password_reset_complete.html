{% extends "users/auth_base.html" %}

{% block content %}
<div class="bg-white  border border-slate-200  p-8 rounded-3xl shadow-2xl space-y-6 text-center">
    
    <div class="w-16 h-16 bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>

    <a href="{% url 'users_web:login' %}" class="block w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all mt-6 shadow-lg shadow-indigo-600/30">
        Fazer Login
    </a>
</div>
{% endblock %}
