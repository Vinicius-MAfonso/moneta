{% extends "users/auth_base.html" %}

{% block title %}Recuperar Senha - Moneta{% endblock %}
{% block subtitle %}Informe seu e-mail e enviaremos instruções para criar uma nova senha.{% endblock %}

{% block content %}
<div class="bg-white  border border-slate-200  p-8 rounded-3xl shadow-2xl space-y-6">
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-600  uppercase tracking-wider mb-2">E-mail Cadastrado</label>
            <input type="email" name="email" required placeholder="seu@email.com" class="w-full bg-slate-50  border border-slate-300  rounded-xl px-4 py-3 text-sm text-slate-900  placeholder-slate-400  focus:outline-none focus:border-indigo-500 transition">
            {{ form.email.errors }}
        </div>

        <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all shadow-lg shadow-indigo-600/30 mt-2">
            Enviar Instruções
        </button>
    </form>

    <div class="pt-6 mt-6 border-t border-slate-200  text-center">
        <a href="{% url 'users_web:login' %}" class="text-sm font-semibold text-indigo-600  hover:text-indigo-500  transition">
            &larr; Voltar para o Login
        </a>
    </div>
</div>
{% endblock %}
