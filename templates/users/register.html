{% extends "users/auth_base.html" %}
{% block title %}Criar Conta - Moneta{% endblock %}
{% block subtitle %}Comece a controlar suas finanças hoje mesmo{% endblock %}
{% block content %}
<div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-2xl space-y-6">
    <form x-data="{ loading: false }" @submit="loading = true" method="POST" action="{% url 'users_web:register' %}" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nome</label>
                <input type="text" name="first_name" required placeholder="Seu nome" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Sobrenome</label>
                <input type="text" name="last_name" required placeholder="Seu sobrenome" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Usuário</label>
            <input type="text" name="username" required placeholder="Escolha seu nome de usuário" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">E-mail</label>
            <input type="email" name="email" required placeholder="seu@email.com" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Senha</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Confirmar</label>
                <input type="password" name="password_confirm" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>
        <button type="submit" :disabled="loading" :class="{'opacity-75 cursor-not-allowed': loading}" class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all shadow-lg shadow-indigo-600/30 mt-2">
            <svg x-show="loading" style="display: none;" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-show="!loading">Cadastrar</span>
            <span x-show="loading" style="display: none;">Processando...</span>
        </button>
    </form>
    <div class="pt-4 border-t border-slate-200 text-center text-xs text-slate-500">
        <span>Já possui uma conta?</span>
        <a href="{% url 'users_web:login' %}" class="text-indigo-600 hover:underline font-semibold ml-1">Entrar agora</a>
    </div>
</div>
{% endblock %}
