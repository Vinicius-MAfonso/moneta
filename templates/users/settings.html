{% extends "base.html" %}

{% block title %}Configurações - Moneta{% endblock %}

{% block content %}
<div class="space-y-6 max-w-4xl">

    <!-- Header -->
    <div>
        <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Perfil & Configurações</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Gerencie suas informações pessoais, foto de perfil, moeda padrão e fuso horário</p>
    </div>

    <!-- Form Panel -->
    <div class="glass-panel p-6 rounded-2xl">
        <form method="POST" action="{% url 'users_web:settings' %}" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}



            <!-- Name and Surname -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Nome</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="Seu nome" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Sobrenome</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="Seu sobrenome" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">E-mail</label>
                <input type="email" name="email" value="{{ user.email }}" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Preferences (Currency & Timezone) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-4 border-t border-slate-200 dark:border-slate-800">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Moeda Padrão</label>
                    <select name="currency" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="BRL" {% if user.currency == 'BRL' %}selected{% endif %}>Real Brasileiro (BRL / R$)</option>
                        <option value="USD" {% if user.currency == 'USD' %}selected{% endif %}>Dólar Americano (USD / $)</option>
                        <option value="EUR" {% if user.currency == 'EUR' %}selected{% endif %}>Euro (EUR / €)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Fuso Horário</label>
                    <select name="timezone" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="America/Sao_Paulo" {% if user.timezone == 'America/Sao_Paulo' %}selected{% endif %}>America/Sao_Paulo (GMT-3)</option>
                        <option value="UTC" {% if user.timezone == 'UTC' %}selected{% endif %}>UTC (GMT+0)</option>
                        <option value="America/New_York" {% if user.timezone == 'America/New_York' %}selected{% endif %}>America/New_York (GMT-5)</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end pt-4">
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/25">
                    Salvar Alterações
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
