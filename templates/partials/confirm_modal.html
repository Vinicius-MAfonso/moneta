<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4" x-data="{ open: true }" x-show="open" x-transition>
    <div class="glass-panel max-w-md w-full p-6 rounded-2xl shadow-2xl border border-slate-200  space-y-5 bg-white  text-slate-900 ">
        
        <div class="flex items-start space-x-4">
            <div class="w-11 h-11 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-600  shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <div class="space-y-1">
                <h3 class="text-lg font-extrabold text-slate-900  tracking-tight">{{ title|default:"Confirmar Exclusão" }}</h3>
                <p class="text-xs text-slate-500  leading-relaxed">{{ message }}</p>
            </div>
        </div>

        <form hx-post="{{ action_url }}" hx-target="#modal-container" hx-on::after-request="if(event.detail.successful) { window.location.reload(); }" class="space-y-4">
            {% csrf_token %}

            {% if options %}
                <div class="space-y-2 pt-2 border-t border-slate-200 ">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500  mb-1">Opções de exclusão:</label>
                    {% for opt in options %}
                        <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700  p-2.5 rounded-xl border border-slate-200  hover:bg-slate-50  cursor-pointer">
                            <input type="radio" name="delete_mode" value="{{ opt.value }}" {% if forloop.first %}checked{% endif %} class="text-rose-600 focus:ring-rose-500">
                            <span>{{ opt.label }}</span>
                        </label>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-200 ">
                <button type="button" @click="$el.closest('.fixed').remove()" class="px-4 py-2 rounded-xl bg-slate-200  hover:bg-slate-300  text-slate-800  font-semibold text-xs transition">
                    Cancelar
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs transition shadow-lg shadow-rose-600/25">
                    Confirmar Exclusão
                </button>
            </div>
        </form>
    </div>
</div>
