<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overscroll-none"
     x-data="{ open: true }"
     x-show="open"
     x-transition.opacity.duration.200ms
     role="dialog"
     aria-modal="true"
     aria-labelledby="confirm-modal-title"
     @click.self="open = false; setTimeout(() => $el.remove(), 200)"
     @keydown.escape.window="open = false; setTimeout(() => $el.remove(), 200)">
    <div class="bg-white text-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-5 md:p-6 space-y-4 relative animate-in fade-in zoom-in duration-150 max-h-[90vh] overflow-y-auto overscroll-contain"
         x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop>
        
        <div class="flex items-start justify-between">
            <div class="flex items-start space-x-3.5">
                <div class="w-10 h-10 rounded-xl {{ icon_bg_class|default:'bg-rose-500/10 border border-rose-500/30 text-rose-600' }} flex items-center justify-center shrink-0 mt-0.5">
                    {% if icon_svg %}
                        {{ icon_svg|safe }}
                    {% else %}
                        <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    {% endif %}
                </div>
                <div class="space-y-1">
                    <h3 id="confirm-modal-title" class="text-lg font-bold text-slate-900">{{ title|default:"Confirmar Exclusão" }}</h3>
                    <p class="text-xs text-slate-500 leading-relaxed">{{ message }}</p>
                </div>
            </div>
            <button type="button" @click="open = false; setTimeout(() => $el.closest('.fixed').remove(), 200)" aria-label="Fechar modal" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition shrink-0 ml-2">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form hx-post="{{ action_url }}" hx-target="#modal-container" hx-on::after-request="if(event.detail.successful) { document.getElementById('filter-form') ? document.getElementById('filter-form').dispatchEvent(new Event('submit')) : window.location.reload(); this.closest('.fixed').remove(); }" class="space-y-4">
            {% csrf_token %}

            {% if options %}
                <div class="space-y-2 pt-3 border-t border-slate-200">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Opções de exclusão:</label>
                    {% for opt in options %}
                        <label class="flex items-center space-x-2.5 text-xs font-semibold text-slate-700 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="delete_mode" value="{{ opt.value }}" aria-label="{{ opt.label }}" {% if forloop.first %}checked{% endif %} class="text-rose-600 focus:ring-rose-500">
                            <span>{{ opt.label }}</span>
                        </label>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                <button type="button" @click="open = false; setTimeout(() => $el.closest('.fixed').remove(), 200)" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200/80 font-semibold text-xs sm:text-sm shadow-sm transition">
                    Cancelar
                </button>
                <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl {{ confirm_btn_class|default:'bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs sm:text-sm transition shadow-lg shadow-rose-600/25' }}">
                    {{ confirm_btn_text|default:"Confirmar Exclusão" }}
                </button>
            </div>
        </form>
    </div>
</div>
