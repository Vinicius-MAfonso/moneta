{% load transaction_tags %}
{% if is_bill_payment %}
    <span class="inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-lg text-xs font-semibold bg-violet-50 text-violet-700 border border-violet-200 shadow-sm max-w-full truncate">
        <span class="text-sm">🧾</span>
        <span class="truncate">Pagamento Fatura</span>
    </span>
{% elif category %}
    <span class="inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-lg text-xs font-semibold border shadow-sm max-w-full truncate"
          style="background-color: {{ category.color|hex_alpha:'15' }}; border-color: {{ category.color|hex_alpha:'40' }}; color: {{ category.color }};">
        {% if category.icon %}
            <span class="text-sm shrink-0">{{ category.icon }}</span>
        {% else %}
            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: {{ category.color }};"></span>
        {% endif %}
        <span class="truncate">{{ category.name }}</span>
    </span>
{% else %}
    <span class="text-slate-400 text-xs">-</span>
{% endif %}
