services:
  # Web Service
  - type: web
    name: moneta-web
    env: python
    region: ohio # Adjust if needed
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12 # Ensure compatibility
      - key: DATABASE_URL
        fromDatabase:
          name: moneta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"

  # Database Service
  - type: psql
    name: moneta-db
    region: ohio
    plan: free
    databaseName: moneta
    user: moneta_user
