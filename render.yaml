services:
  # Web Service
  - type: web
    name: moneta-web
    env: python
    region: ohio # Adjust if needed
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12 # Ensure compatibility
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard (Supabase URL)
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://moneta-web.onrender.com"
      - key: NODE_VERSION
        value: "20.11.1"


